[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "india-heatwave-benchmark"
version = "0.2.0"
description = "Leakage-safe, region-held-out India heatwave prediction benchmark"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Aryan Wankhade" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "xarray>=2024.1",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "requests>=2.31",
]

[project.optional-dependencies]
boosting = ["xgboost>=2.0"]
netcdf = ["netCDF4>=1.6", "h5netcdf>=1.3"]
era5-cloud = ["icechunk>=1.0", "zarr>=3.0", "s3fs>=2024.3", "numcodecs[pcodec]>=0.3"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
heatwave_benchmark = ["imd_region_mask_1deg.csv", "india_boundary_10m.geojson"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
